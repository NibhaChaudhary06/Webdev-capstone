<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Expense – Smart Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo"><span class="logo-icon">💰</span> Expense Tracker</div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="add-expense.html" class="active">➕ Add Expense</a></li>
        <li><a href="budget.html">💼 Budget</a></li>
        <li><a href="charts.html">📊 Charts</a></li>
        <li><a href="insights.html">💡 Insights</a></li>
        <li><a href="contact.html">📬 Contact</a></li>
      </ul>
    </div>
  </nav>
  <main>

    <div class="page-header">
      <h1>➕ Add New Expense</h1>
      <p>Fill in the form — data is sent to the backend using a <strong>POST</strong> API call.</p>
    </div>

    <div class="form-card">
      <div class="form-grid">

        <div class="form-group full-width">
          <label for="title">Expense Title *</label>
          <input type="text" id="title" placeholder="e.g. Grocery Shopping" />
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹) *</label>
          <input type="number" id="amount" placeholder="e.g. 500" min="1" step="0.01" />
        </div>

        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category">
            <option value="">— Select Category —</option>
            <option value="Food">🍔 Food</option>
            <option value="Travel">🚌 Travel</option>
            <option value="Rent">🏠 Rent</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Health">💊 Health</option>
            <option value="Education">📚 Education</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date *</label>
          <input type="date" id="date" />
        </div>

        <div class="form-group">
          <label for="note">Note (optional)</label>
          <input type="text" id="note" placeholder="Any extra info…" />
        </div>

        <div class="form-group full-width">
          <button class="btn-primary" id="submitBtn" onclick="submitExpense()">
            ➕ Add Expense
          </button>
        </div>

        <div class="form-group full-width">
          <div class="alert" id="alertMsg"></div>
        </div>

      </div>
    </div>

  </main>

  <footer>
    <p>Smart Expense Tracker &copy; 2025 &nbsp;|&nbsp; Made with using HTML, CSS, JS &amp; Flask</p>
  </footer>

  <script src="js/add-expense.js"></script>
</body>
</html>
